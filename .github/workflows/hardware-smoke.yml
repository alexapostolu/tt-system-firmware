name: HW Smoke

on:
  push:
    branches:
      - v*-branch
      - collab*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    branches:
      - main
      - v*-branch
      - collab*
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gen-config:
    runs-on: ubuntu-24.04
    outputs:
      matrix-config-bh: ${{ steps.gen-config.outputs.matrix-config-bh }}
      matrix-config-wh: ${{ steps.gen-config.outputs.matrix-config-wh }}
    steps:
      - uses: actions/checkout@v4
      - id: gen-config
        shell: bash
        run: |
          # Filter to only Blackhole boards (product == "bh"), then remove the product field
          # Exclude galaxy, loudbox, and quietbox2 since they have no STLink/recovery path for smoke tests
          MATRIX_CONFIG_BH="$(jq -c '[.[] | select((.product == "bh") and (.board != "galaxy") and (.board != "loudbox") and (.board != "quietbox2")) | del(.product)]' .github/ci_boards.json)"
          echo "matrix-config-bh=$MATRIX_CONFIG_BH" | tee -a $GITHUB_OUTPUT

          # Filter to only Wormhole boards (product == "wh"), then remove the product field
          MATRIX_CONFIG_WH="$(jq -c '[.[] | select(.product == "wh") | del(.product)]' .github/ci_boards.json)"
          echo "matrix-config-wh=$MATRIX_CONFIG_WH" | tee -a $GITHUB_OUTPUT

  detect-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      wh-blob-changed: ${{ steps.changes.outputs.wh-blob }}
    steps:
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            wh-blob:
              - 'zephyr/blobs/fw_pack-wormhole.tar.gz'

  build-bh-mod:
    name: Build bh-mod
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/tenstorrent/tt-system-firmware/ci-image:v19.11.0
    env:
      LUWEN_REPO: ${{ vars.LUWEN_REPO || 'https://github.com/tenstorrent/luwen.git' }}
      # Pinned to an immutable commit for reproducible builds; override via the LUWEN_REF repo var.
      LUWEN_REF: ${{ vars.LUWEN_REF || 'f58459da323b466e36ea065bed0fa4dc456eb3ab' }}
    steps:
      - name: Build bh-mod
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v protoc >/dev/null 2>&1 || missing+=(protobuf-compiler)
          command -v curl   >/dev/null 2>&1 || missing+=(curl ca-certificates)
          command -v git    >/dev/null 2>&1 || missing+=(git)
          if [ ${#missing[@]} -gt 0 ]; then
            apt-get update && apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          protoc --version
          # Ensure a Rust toolchain is available
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
          # Shallow-fetch the pinned ref. Using fetch (not clone --branch) so that
          # LUWEN_REF can be a commit SHA, tag, or branch name.
          rm -rf "$HOME/luwen"
          mkdir -p "$HOME/luwen"
          git -C "$HOME/luwen" init -q
          git -C "$HOME/luwen" remote add origin "$LUWEN_REPO"
          git -C "$HOME/luwen" fetch --depth 1 origin "$LUWEN_REF"
          git -C "$HOME/luwen" checkout -q FETCH_HEAD
          # Record the exact source revision the binary was built from for provenance.
          LUWEN_SHA="$(git -C "$HOME/luwen" rev-parse HEAD)"
          cargo build --release -p bh-mod --manifest-path "$HOME/luwen/Cargo.toml"
          install -D -m 0755 "$HOME/luwen/target/release/bh-mod" bh-mod/bh-mod
          printf '%s\n' "$LUWEN_SHA" > bh-mod/luwen.sha
          echo "Built bh-mod from luwen $LUWEN_SHA"
          ./bh-mod/bh-mod --help

      - name: Upload bh-mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: bh-mod
          # Include the luwen.sha provenance file alongside the binary.
          path: |
            bh-mod/bh-mod
            bh-mod/luwen.sha
          if-no-files-found: error
          # Use the default (longer) retention since this binary is also handed
          # to the deployment team, not just consumed by the e2e jobs.
          retention-days: 90

  hardware-smoke-test:
    name: BH Hardware Smoke Test on ${{ matrix.config.board }}
    if: github.event_name != 'schedule'
    needs: [gen-config]
    env:
      ASIC_ID: 0
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.gen-config.outputs.matrix-config-bh) }}
    runs-on: ${{ matrix.config.runs-on }}
    container:
      image: ghcr.io/tenstorrent/tt-system-firmware/ci-image:v19.11.0
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /opt/tenstorrent/kmd-builds/:/opt/tenstorrent/kmd-builds/
      options: '--device /dev/tenstorrent --device /dev/bus/usb --device /dev/ipmi0 --privileged'
    steps:
      - name: Cleanup State
        if: ${{ always() }}
        run: |
          # Print state of current directory
          ls -la
          # Clean up any files left over from previous steps
          rm -rf *

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          path: tt-system-firmware

      - name: Prepare Container
        uses: ./tt-system-firmware/.github/workflows/prepare-container
        with:
          app-path: tt-system-firmware
          kmd-version: ${{ matrix.config.kmd_build }}

      - name: run-dmc-tests
        run: |
          tt-system-firmware/scripts/ci/run-smoke.sh -t dmc -p $ASIC_ID ${{ matrix.config.board }}

      - name: Upload DMC Smoke Tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DMC Smoke test results (${{ matrix.config.board }})
          include-hidden-files: true
          path: |
            zephyr/twister-dmc-smoke/**/handler.log
            zephyr/twister-dmc-smoke/**/twister_harness.log
            zephyr/twister-dmc-smoke/**/zephyr.dts
            zephyr/twister-dmc-smoke/**/.config
            zephyr/twister-dmc-smoke/**/*.map
            zephyr/twister-dmc-smoke/**/zephyr.elf
            zephyr/twister-dmc-smoke/**/*.lst
            zephyr/twister-dmc-smoke/**/device.log
            zephyr/twister-dmc-smoke/twister.log
            zephyr/twister-dmc-smoke/twister.json

      - name: run-smc-tests
        run: |
          tt-system-firmware/scripts/ci/run-smoke.sh -t smc -p $ASIC_ID ${{ matrix.config.board }}


      - name: Upload SMC Smoke Tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: SMC Smoke test results (${{ matrix.config.board }})
          include-hidden-files: true
          path: |
            zephyr/twister-smc-smoke/**/handler.log
            zephyr/twister-smc-smoke/**/twister_harness.log
            zephyr/twister-smc-smoke/**/zephyr.dts
            zephyr/twister-smc-smoke/**/.config
            zephyr/twister-smc-smoke/**/*.map
            zephyr/twister-smc-smoke/**/zephyr.elf
            zephyr/twister-smc-smoke/**/*.lst
            zephyr/twister-smc-smoke/**/device.log
            zephyr/twister-smc-smoke/twister.log
            zephyr/twister-smc-smoke/twister.json

      - name: Print RTT logs
        if: ${{ failure() }}
        working-directory: tt-system-firmware
        run: |
          echo "DMC RTT logs:"
          python3 ./scripts/dmc_rtt.py -n
          echo "SMC RTT logs:"
          python3 ./scripts/smc_console.py --rtt -n
          echo "SMC state dump:"
          python3 ./scripts/dump_smc_state.py --asic-id $ASIC_ID

  smoke-e2e-test:
    name: BH Smoke E2E Test on ${{ matrix.config.board }}
    if: github.event_name != 'schedule'
    needs: [gen-config, build-bh-mod]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.gen-config.outputs.matrix-config-bh) }}
    runs-on: ${{ matrix.config.runs-on }}
    container:
      image: ghcr.io/tenstorrent/tt-system-firmware/ci-image:v19.11.0
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /opt/tenstorrent/kmd-builds/:/opt/tenstorrent/kmd-builds/
      options: '--device /dev/tenstorrent --device /dev/bus/usb --device /dev/ipmi0 --privileged'
    steps:
      - name: Cleanup State
        if: ${{ always() }}
        run: |
          # Print state of current directory
          ls -la
          # Clean up any files left over from previous steps
          rm -rf *

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          path: tt-system-firmware

      - name: Prepare Container
        uses: ./tt-system-firmware/.github/workflows/prepare-container
        with:
          app-path: tt-system-firmware
          kmd-version: ${{ matrix.config.kmd_build }}

      - name: Set ASIC ID
        shell: bash
        run: |
          echo "ASIC_ID=0" >> "$GITHUB_ENV"

      - name: Check signing key
        shell: bash
        run: |
          SIGNATURE_KEY_FILE="$(mktemp)"
          echo "${{ secrets.SIGNATURE_KEY }}" | base64 -d > "$SIGNATURE_KEY_FILE"
          SZ=$(wc -c "$SIGNATURE_KEY_FILE" | awk '{print $1}')
          if [ $SZ -lt 42 ]; then
            echo "No valid signing key found, using temporary key"
            openssl genrsa -out "$SIGNATURE_KEY_FILE" 2048
          fi
          echo "SIGNATURE_KEY_FILE=$SIGNATURE_KEY_FILE" >> "$GITHUB_ENV"

      - name: Download bh-mod
        uses: actions/download-artifact@v4
        with:
          name: bh-mod
          path: bh-mod

      - name: Install bh-mod
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 bh-mod/bh-mod /usr/local/bin/bh-mod
          bh-mod --help

      - name: run-e2e-tests
        run: |
          tt-system-firmware/scripts/ci/run-e2e.sh -k $SIGNATURE_KEY_FILE \
            -p $ASIC_ID ${{ matrix.config.board }}

      - name: Upload E2E Test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: E2E test results (${{ matrix.config.board }})
          include-hidden-files: true
          path: |
            zephyr/twister-*e2e*/**/handler.log
            zephyr/twister-*e2e*/**/twister_harness.log
            zephyr/twister-*e2e*/**/zephyr.dts
            zephyr/twister-*e2e*/**/.config
            zephyr/twister-*e2e*/**/*.map
            zephyr/twister-*e2e*/**/zephyr.elf
            zephyr/twister-*e2e*/**/*.lst
            zephyr/twister-*e2e*/**/device.log
            zephyr/twister-*e2e*/twister.log
            zephyr/twister-*e2e*/twister.json
            zephyr/twister-*e2e*/**/update.fwbundle

      - name: Print RTT logs
        if: ${{ failure() }}
        working-directory: tt-system-firmware
        run: |
          echo "DMC RTT logs:"
          python3 ./scripts/dmc_rtt.py -n
          echo "SMC RTT logs:"
          python3 ./scripts/smc_console.py --rtt -n
          echo "SMC state dump:"
          python3 ./scripts/dump_smc_state.py --asic-id $ASIC_ID

  smoke-e2e-wh-test:
    name: WH Smoke E2E Test on ${{ matrix.config.board }}
    needs: [gen-config, detect-changes]
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'wh-tests') || needs.detect-changes.outputs.wh-blob-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.gen-config.outputs.matrix-config-wh) }}
    runs-on: ${{ matrix.config.runs-on }}
    container:
      image: ghcr.io/tenstorrent/tt-system-firmware/ci-image:v19.11.0
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /opt/tenstorrent/kmd-builds/:/opt/tenstorrent/kmd-builds/
      options: '--device /dev/tenstorrent --device /dev/bus/usb --privileged'
    steps:
      - name: Cleanup State
        if: ${{ always() }}
        run: |
          # Print state of current directory
          ls -la
          # Clean up any files left over from previous steps
          rm -rf *

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          path: tt-zephyr-platforms

      - name: Prepare Container
        uses: ./tt-zephyr-platforms/.github/workflows/prepare-container
        with:
          app-path: tt-zephyr-platforms
          kmd-version: ${{ matrix.config.kmd_build }}

      - name: Run WH E2E Tests
        working-directory: tt-zephyr-platforms
        run: |
          pytest -s -v --log-cli-level=DEBUG --tb=short --junit-xml=wh_e2e_results.xml -k "not test_upgrade_from_19_0" app/wh/pytest/e2e_smoke.py

      - name: Upload WH E2E Test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WH E2E test results (${{ matrix.config.board }})
          include-hidden-files: true
          path: |
            tt-zephyr-platforms/wh_e2e_results.xml
            tt-zephyr-platforms/**/*.log
            tt-zephyr-platforms/**/pytest_cache/
